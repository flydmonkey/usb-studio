name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships Android SDK + licenses.
      # android-actions/setup-android@v3 still tries to install the
      # removed `tools` package and fails before Flutter runs.

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: App Dart tests
        run: flutter test

      - name: Plugin Dart tests
        working-directory: packages/usb_capture
        run: flutter test test

      - name: Android unit tests
        run: |
          flutter build apk --config-only
          cd android
          ./gradlew :usb_capture:testDebugUnitTest --no-daemon

      - name: Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: usb-studio-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
