<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USB Studio · LAN playback</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    .hint { color: #888; font-size: 0.85rem; margin: 0 0 16px; }
    h2 { font-size: 0.95rem; color: #bbb; margin: 20px 0 8px; }
    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 8px;
    }
    .player-bar h2 { margin: 0; }
    .live-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }
    .live-toggle input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #4aa3ff;
    }
    .fs-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      border: 1px solid #555;
      background: rgba(0, 0, 0, 0.65);
      color: #eee;
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .fs-btn:hover { border-color: #4aa3ff; }
    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .player video,
    .player img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .player img.hidden,
    .player video.hidden { display: none; }
    .player:fullscreen,
    .player:-webkit-full-screen,
    .player.page-full {
      width: 100vw;
      height: 100vh;
      max-width: none;
      aspect-ratio: auto;
      border-radius: 0;
    }
    .player.page-full {
      position: fixed;
      inset: 0;
      z-index: 1000;
    }
    .live-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      color: #ccc;
      font-size: 0.95rem;
      text-align: center;
      padding: 12px;
    }
    .live-status.hidden { display: none; }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0 0 8px;
      padding: 12px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #1a1a1a;
      color: inherit;
      font: inherit;
      text-align: left;
    }
    .item:hover, .item.active {
      border-color: #4aa3ff;
      background: #1c2733;
    }
    .item .play {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item .meta {
      color: #888;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    .item .dl {
      flex-shrink: 0;
      color: #4aa3ff;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .item .dl:hover { text-decoration: underline; }
    .empty, .error { color: #888; margin: 8px 0; }
    .error { color: #f88; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="page-title">USB Studio · LAN playback</h1>
    <p class="hint" id="page-hint">Open this HTTP address on the same Wi-Fi. HTTPS is not required. Live is silent video only.</p>

    <div class="player-bar">
      <h2 id="player-heading">Player</h2>
      <label class="live-toggle">
        <input type="checkbox" id="live-toggle">
        <span id="live-toggle-label">Live preview</span>
      </label>
    </div>
    <div class="player" id="player">
      <img id="live" class="hidden" alt="">
      <video id="vod" class="hidden" playsinline></video>
      <div class="live-status" id="live-status">Turn on live preview or pick a recording</div>
      <button type="button" class="fs-btn" id="fs-btn">Fullscreen</button>
    </div>

    <h2 id="recordings-heading">Recordings</h2>
    <div id="recordings"><p class="empty" id="recordings-loading">Loading…</p></div>
  </div>

  <script>
    window.LAN_I18N = window.LAN_I18N || {};
    (function () {
      var i18n = window.LAN_I18N || {};
      document.documentElement.lang = i18n.lang || 'en';
      document.title = i18n.title || document.title;
      var setText = function (id, value) {
        var el = document.getElementById(id);
        if (el && value) el.textContent = value;
      };
      setText('page-title', i18n.title);
      setText('page-hint', i18n.hint);
      setText('player-heading', i18n.player);
      setText('live-toggle-label', i18n.livePreview);
      setText('fs-btn', i18n.fullscreen);
      setText('live-status', i18n.chooseSource);
      setText('recordings-heading', i18n.recordings);
      setText('recordings-loading', i18n.loading);

      var liveToggle = document.getElementById('live-toggle');
      var fsBtn = document.getElementById('fs-btn');
      var player = document.getElementById('player');
      var liveImg = document.getElementById('live');
      var liveStatus = document.getElementById('live-status');
      var container = document.getElementById('recordings');
      var vodVideo = document.getElementById('vod');
      var liveOn = false;
      var liveBound = false;
      var liveRetry = null;
      var vodActive = false;

      function showOverlay(text) {
        liveStatus.textContent = text || i18n.chooseSource || 'Turn on live preview or pick a recording';
        liveStatus.classList.remove('hidden');
      }

      function hideOverlay() {
        liveStatus.classList.add('hidden');
      }

      function stopLiveStream() {
        liveBound = false;
        liveImg.removeAttribute('src');
        liveImg.classList.add('hidden');
      }

      function stopLivePolling() {
        if (liveRetry) {
          clearInterval(liveRetry);
          liveRetry = null;
        }
      }

      function attachLive() {
        if (liveBound && liveImg.getAttribute('src')) return;
        liveBound = true;
        liveImg.classList.remove('hidden');
        liveImg.src = '/live.mjpeg?t=' + Date.now();
      }

      function stopVod() {
        vodActive = false;
        vodVideo.pause();
        vodVideo.removeAttribute('src');
        vodVideo.removeAttribute('controls');
        vodVideo.load();
        vodVideo.classList.add('hidden');
      }

      function applyLiveStatus(st) {
        if (!liveOn) return;
        if (!st) return;
        if (st.paused) {
          stopLiveStream();
          showOverlay(i18n.pausedStream);
          return;
        }
        if (!st.hasCard) {
          stopLiveStream();
          showOverlay(i18n.waitingCard);
          return;
        }
        attachLive();
        if (st.ready) hideOverlay();
        else showOverlay(i18n.waitingCard);
      }

      function pollLiveOnce() {
        if (!liveOn) return Promise.resolve(false);
        return fetch('/api/live', { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (st) {
            applyLiveStatus(st);
            return !!(st && st.ready);
          })
          .catch(function () {
            if (liveOn) showOverlay(i18n.waitingCard);
            return false;
          });
      }

      function setLiveOn(on) {
        liveOn = !!on;
        liveToggle.checked = liveOn;
        if (!liveOn) {
          stopLivePolling();
          stopLiveStream();
          if (vodActive) {
            hideOverlay();
          } else {
            showOverlay(i18n.chooseSource);
          }
          return;
        }
        stopVod();
        document.querySelectorAll('.item.active').forEach(function (el) {
          el.classList.remove('active');
        });
        showOverlay(i18n.waitingCard);
        pollLiveOnce();
        if (!liveRetry) liveRetry = setInterval(pollLiveOnce, 2000);
      }

      liveToggle.addEventListener('change', function () {
        setLiveOn(liveToggle.checked);
      });

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function isPageFull() {
        return player.classList.contains('page-full');
      }

      function isFull() {
        return fullscreenElement() === player || isPageFull();
      }

      function updateFsLabel() {
        fsBtn.textContent = isFull()
          ? (i18n.exitFullscreen || 'Exit fullscreen')
          : (i18n.fullscreen || 'Fullscreen');
      }

      function enterFull() {
        var req = player.requestFullscreen || player.webkitRequestFullscreen;
        if (req) {
          Promise.resolve(req.call(player)).catch(function () {
            player.classList.add('page-full');
            updateFsLabel();
          });
          return;
        }
        player.classList.add('page-full');
        updateFsLabel();
      }

      function exitFull() {
        var el = fullscreenElement();
        if (el) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
        player.classList.remove('page-full');
        updateFsLabel();
      }

      function toggleFull() {
        if (isFull()) exitFull();
        else enterFull();
      }

      fsBtn.addEventListener('click', function (event) {
        event.stopPropagation();
        toggleFull();
      });
      fsBtn.addEventListener('dblclick', function (event) {
        event.stopPropagation();
      });
      player.addEventListener('dblclick', toggleFull);
      document.addEventListener('fullscreenchange', updateFsLabel);
      document.addEventListener('webkitfullscreenchange', updateFsLabel);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && isPageFull()) {
          exitFull();
        }
      });
      liveImg.addEventListener('load', function () {
        if (liveOn) hideOverlay();
      });
      liveImg.addEventListener('error', function () {
        liveBound = false;
        if (liveOn) showOverlay(i18n.waitingCard);
      });

      function formatBytes(bytes) {
        var n = Number(bytes) || 0;
        if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
        if (n >= 1048576) return Math.round(n / 1048576) + ' MB';
        if (n >= 1024) return Math.round(n / 1024) + ' KB';
        return n + ' B';
      }

      fetch('/api/recordings')
        .then(function (res) {
          if (!res.ok) throw new Error('load failed');
          return res.json();
        })
        .then(function (items) {
          if (!items.length) {
            container.innerHTML = '<p class="empty">' + escapeHtml(i18n.empty || '') + '</p>';
            return;
          }
          var list = document.createElement('div');
          list.className = 'list';
          items.forEach(function (item) {
            var id = item.id || '';
            var name = item.name || i18n.unnamed || 'Untitled';
            var row = document.createElement('div');
            row.className = 'item';
            var play = document.createElement('button');
            play.type = 'button';
            play.className = 'play';
            play.innerHTML =
              '<span class="name">' + escapeHtml(name) + '</span>' +
              '<span class="meta">' + formatBytes(item.bytes) + '</span>';
            play.addEventListener('click', function () {
              list.querySelectorAll('.item').forEach(function (el) {
                el.classList.remove('active');
              });
              row.classList.add('active');
              vodActive = true;
              setLiveOn(false);
              vodVideo.classList.remove('hidden');
              vodVideo.setAttribute('controls', '');
              vodVideo.src = '/vod/' + encodeURIComponent(id);
              hideOverlay();
              vodVideo.play().catch(function () {});
            });
            var dl = document.createElement('a');
            dl.className = 'dl';
            dl.href = '/vod/' + encodeURIComponent(id) + '?download=1';
            dl.setAttribute('download', '');
            dl.textContent = i18n.download || 'Download';
            dl.addEventListener('click', function (event) {
              event.stopPropagation();
            });
            row.appendChild(play);
            row.appendChild(dl);
            list.appendChild(row);
          });
          container.innerHTML = '';
          container.appendChild(list);
        })
        .catch(function () {
          container.innerHTML = '<p class="error">' + escapeHtml(i18n.loadFailed || '') + '</p>';
        });

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
