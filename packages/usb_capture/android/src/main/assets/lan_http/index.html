<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USB Studio · LAN playback</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    .hint { color: #888; font-size: 0.85rem; margin: 0 0 16px; }
    h2 { font-size: 0.95rem; color: #bbb; margin: 20px 0 8px; }
    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .player video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .live-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      color: #ccc;
      font-size: 0.95rem;
    }
    .live-status.hidden { display: none; }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0 0 8px;
      padding: 12px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #1a1a1a;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .item:hover, .item.active {
      border-color: #4aa3ff;
      background: #1c2733;
    }
    .item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item .meta {
      color: #888;
      font-size: 0.82rem;
      flex-shrink: 0;
    }
    .empty, .error { color: #888; margin: 8px 0; }
    .error { color: #f88; }
    #vod-wrap { display: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="page-title">USB Studio · LAN playback</h1>
    <p class="hint" id="page-hint">Open this HTTP address on the same Wi-Fi. HTTPS is not required. Live starts muted; tap the player to unmute.</p>

    <h2 id="live-heading">Live</h2>
    <div class="player">
      <video id="live" controls autoplay muted playsinline></video>
      <div class="live-status" id="live-status">Waiting for capture card</div>
    </div>

    <h2 id="recordings-heading">Recordings</h2>
    <div id="recordings"><p class="empty" id="recordings-loading">Loading…</p></div>
    <div class="player" id="vod-wrap">
      <video id="vod" controls playsinline></video>
    </div>
  </div>

  <script src="/hls.min.js"></script>
  <script>
    window.LAN_I18N = window.LAN_I18N || {};
    (function () {
      var i18n = window.LAN_I18N || {};
      document.documentElement.lang = i18n.lang || 'en';
      document.title = i18n.title || document.title;
      var setText = function (id, value) {
        var el = document.getElementById(id);
        if (el && value) el.textContent = value;
      };
      setText('page-title', i18n.title);
      setText('page-hint', i18n.hint);
      setText('live-heading', i18n.live);
      setText('live-status', i18n.waitingCard);
      setText('recordings-heading', i18n.recordings);
      setText('recordings-loading', i18n.loading);

      var liveVideo = document.getElementById('live');
      var liveStatus = document.getElementById('live-status');
      var container = document.getElementById('recordings');
      var vodWrap = document.getElementById('vod-wrap');
      var vodVideo = document.getElementById('vod');
      var liveHls = null;
      var livePoll = null;

      function showWaiting(text) {
        liveStatus.textContent = text || i18n.waitingCard || 'Waiting for capture card';
        liveStatus.classList.remove('hidden');
      }

      function hideWaiting() {
        liveStatus.classList.add('hidden');
      }

      function playlistReady(text) {
        var matches = text.match(/#EXTINF/g);
        return matches && matches.length >= 1;
      }

      function destroyLiveHls() {
        if (liveHls) {
          liveHls.destroy();
          liveHls = null;
        }
      }

      function attachLive() {
        var src = '/live.m3u8';
        destroyLiveHls();
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          liveHls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 6,
            manifestLoadingMaxRetry: 30,
            manifestLoadingRetryDelay: 1500,
            levelLoadingMaxRetry: 30,
            fragLoadingMaxRetry: 8,
            maxBufferHole: 2.0
          });
          liveHls.loadSource(src);
          liveHls.attachMedia(liveVideo);
          liveHls.on(Hls.Events.MANIFEST_PARSED, function () {
            hideWaiting();
            liveVideo.play().catch(function () {});
          });
          liveHls.on(Hls.Events.ERROR, function (_event, data) {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              liveHls.startLoad();
              return;
            }
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              liveHls.recoverMediaError();
              return;
            }
            showWaiting(i18n.waitingCard);
            destroyLiveHls();
            scheduleLivePoll();
          });
          return;
        }
        if (liveVideo.canPlayType('application/vnd.apple.mpegurl')) {
          liveVideo.src = src;
          liveVideo.play().catch(function () {});
          return;
        }
        showWaiting(i18n.liveUnsupported);
      }

      function pollLiveOnce() {
        return fetch('/live.m3u8', { cache: 'no-store' })
          .then(function (res) { return res.text(); })
          .then(function (text) {
            if (playlistReady(text)) {
              hideWaiting();
              attachLive();
              return true;
            }
            showWaiting(i18n.waitingCard);
            return false;
          })
          .catch(function () {
            showWaiting(i18n.waitingCard);
            return false;
          });
      }

      function scheduleLivePoll() {
        if (livePoll) return;
        livePoll = setInterval(function () {
          pollLiveOnce().then(function (ready) {
            if (ready) {
              clearInterval(livePoll);
              livePoll = null;
            }
          });
        }, 2000);
      }

      liveVideo.addEventListener('playing', hideWaiting);
      pollLiveOnce().then(function (ready) {
        if (!ready) scheduleLivePoll();
      });

      function formatBytes(bytes) {
        var n = Number(bytes) || 0;
        if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
        if (n >= 1048576) return Math.round(n / 1048576) + ' MB';
        if (n >= 1024) return Math.round(n / 1024) + ' KB';
        return n + ' B';
      }

      fetch('/api/recordings')
        .then(function (res) {
          if (!res.ok) throw new Error('load failed');
          return res.json();
        })
        .then(function (items) {
          if (!items.length) {
            container.innerHTML = '<p class="empty">' + escapeHtml(i18n.empty || '') + '</p>';
            return;
          }
          var list = document.createElement('div');
          list.className = 'list';
          items.forEach(function (item) {
            var id = item.id || '';
            var name = item.name || i18n.unnamed || 'Untitled';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'item';
            btn.innerHTML =
              '<span class="name">' + escapeHtml(name) + '</span>' +
              '<span class="meta">' + formatBytes(item.bytes) + '</span>';
            btn.addEventListener('click', function () {
              list.querySelectorAll('.item').forEach(function (el) {
                el.classList.remove('active');
              });
              btn.classList.add('active');
              vodWrap.style.display = 'block';
              vodVideo.src = '/vod/' + encodeURIComponent(id);
              vodVideo.play().catch(function () {});
              vodWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
            list.appendChild(btn);
          });
          container.innerHTML = '';
          container.appendChild(list);
        })
        .catch(function () {
          container.innerHTML = '<p class="error">' + escapeHtml(i18n.loadFailed || '') + '</p>';
        });

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
